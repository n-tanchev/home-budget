<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" fill="none">
  <rect width="520" height="140" rx="8" fill="#f8f9fa"/>
  <!-- March card -->
  <rect x="20" y="20" width="180" height="100" rx="8" fill="white" stroke="#dee2e6" stroke-width="1.5"/>
  <rect x="20" y="20" width="180" height="28" rx="8" fill="#e9ecef"/>
  <rect x="20" y="40" width="180" height="8" fill="#e9ecef"/>
  <text x="110" y="39" font-family="system-ui" font-size="12" font-weight="700" fill="#495057" text-anchor="middle">March 2026</text>
  <text x="32" y="65" font-family="system-ui" font-size="11" fill="#6c757d">Salary</text>
  <text x="185" y="65" font-family="monospace" font-size="11" fill="#10b981" text-anchor="end">3,619.69</text>
  <text x="32" y="82" font-family="system-ui" font-size="11" fill="#6c757d">Electricity</text>
  <text x="185" y="82" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="end">53.02</text>
  <text x="32" y="99" font-family="system-ui" font-size="11" fill="#6c757d">Mortgage</text>
  <text x="185" y="99" font-family="monospace" font-size="11" fill="#f97316" text-anchor="end">1,251.21</text>
  <!-- Arrow -->
  <path d="M 220 70 L 300 70" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowP)" stroke-dasharray="6 4"/>
  <rect x="235" y="55" width="50" height="20" rx="10" fill="#6366f1"/>
  <text x="260" y="69" font-family="system-ui" font-size="9" fill="white" text-anchor="middle" font-weight="600">COPY</text>
  <!-- April card -->
  <rect x="320" y="20" width="180" height="100" rx="8" fill="white" stroke="#6366f1" stroke-width="2"/>
  <rect x="320" y="20" width="180" height="28" rx="8" fill="#eef2ff"/>
  <rect x="320" y="40" width="180" height="8" fill="#eef2ff"/>
  <text x="410" y="39" font-family="system-ui" font-size="12" font-weight="700" fill="#6366f1" text-anchor="middle">April 2026</text>
  <text x="332" y="65" font-family="system-ui" font-size="11" fill="#6c757d">Salary</text>
  <text x="485" y="65" font-family="monospace" font-size="11" fill="#10b981" text-anchor="end">3,619.69</text>
  <text x="332" y="82" font-family="system-ui" font-size="11" fill="#6c757d">Electricity</text>
  <text x="485" y="82" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="end">53.02</text>
  <text x="332" y="99" font-family="system-ui" font-size="11" fill="#6c757d">Mortgage</text>
  <text x="485" y="99" font-family="monospace" font-size="11" fill="#f97316" text-anchor="end">1,251.21</text>
  <defs>
    <marker id="arrowP" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#6366f1" stroke-width="2"/>
    </marker>
  </defs>
</svg>
